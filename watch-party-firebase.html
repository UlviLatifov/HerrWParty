<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bərabər İzləyək</title>

<!-- Firebase SDK (compat versiyası - sadə istifadə üçün) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --panel-edge: #2a2e3a;
    --cream: #f2ede4;
    --cream-dim: #b8b3a8;
    --amber: #e8a33d;
    --amber-dim: #a9793a;
    --teal: #3a6b6b;
    --live-red: #c1443a;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }

  .wp-root {
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 22px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 520px;
    margin: 0 auto;
  }

  .wp-marquee {
    text-align: center;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--panel-edge);
  }
  .wp-marquee h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
    color: var(--amber);
  }
  .wp-marquee p {
    margin: 0;
    color: var(--cream-dim);
    font-size: 13.5px;
  }

  .wp-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 16px;
  }

  .wp-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .wp-field:last-child { margin-bottom: 0; }
  .wp-field label {
    font-size: 12.5px;
    color: var(--cream-dim);
  }
  .wp-field input {
    background: var(--bg);
    border: 1px solid var(--panel-edge);
    color: var(--cream);
    border-radius: 6px;
    padding: 10px 11px;
    font-size: 14.5px;
    font-family: var(--font-body);
    outline: none;
  }
  .wp-field input:focus { border-color: var(--amber-dim); }

  .wp-choice-row { display: flex; gap: 10px; }
  .wp-choice-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--panel-edge);
    color: var(--cream);
    border-radius: 8px;
    padding: 16px 10px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    text-align: center;
  }
  .wp-choice-btn .sub {
    display: block;
    font-weight: 400;
    font-size: 11.5px;
    color: var(--cream-dim);
    margin-top: 4px;
  }
  .wp-choice-btn.active {
    border-color: var(--amber);
    background: rgba(232, 163, 61, 0.08);
  }

  .wp-btn {
    background: var(--amber);
    color: #1c1204;
    border: none;
    border-radius: 6px;
    padding: 12px 16px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    width: 100%;
  }
  .wp-btn:active { background: var(--amber-dim); }
  .wp-btn.wp-secondary {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--panel-edge);
  }
  .wp-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .wp-back {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 0 0 4px;
    text-align: left;
  }

  .wp-live {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--cream-dim);
    margin-bottom: 10px;
  }
  .wp-live.on { display: flex; }
  .wp-live .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live-red);
    animation: wp-pulse 1.4s infinite;
  }
  @keyframes wp-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .wp-code-pill {
    font-family: var(--font-display);
    color: var(--amber);
    letter-spacing: 2px;
    font-size: 14px;
  }

  .wp-video-wrap {
    display: none;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--panel-edge);
  }
  .wp-video-wrap.on { display: block; }
  .wp-video-wrap video { width: 100%; display: block; max-height: 60vh; }

  .wp-chat { display: none; }
  .wp-chat.on { display: flex; flex-direction: column; }

  .wp-chat-log {
    height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
    margin-bottom: 12px;
  }
  .wp-msg { font-size: 13.5px; line-height: 1.4; }
  .wp-msg .name { color: var(--amber); font-weight: 600; margin-right: 6px; }
  .wp-msg.mine .name { color: var(--teal); }
  .wp-msg .time { color: var(--cream-dim); font-size: 11px; margin-left: 6px; }
  .wp-empty { color: var(--cream-dim); font-size: 13px; text-align: center; margin-top: 70px; }

  .wp-chat-input { display: flex; gap: 8px; }
  .wp-chat-input input { flex: 1; }
  .wp-chat-input button {
    background: var(--teal);
    color: var(--cream);
    border: none;
    border-radius: 6px;
    padding: 0 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .wp-hint { font-size: 12px; color: var(--cream-dim); margin-top: 8px; line-height: 1.5; }
  .wp-error { font-size: 12.5px; color: var(--live-red); margin-top: 8px; display: none; }
  .wp-error.on { display: block; }

  .wp-step { display: none; }
  .wp-step.on { display: block; }

  .wp-conn {
    font-size: 11.5px;
    text-align: center;
    color: var(--cream-dim);
  }
  .wp-conn.err { color: var(--live-red); }
</style>
</head>
<body>

<div class="wp-root">
  <div class="wp-marquee">
    <h1>Bərabər İzləyək</h1>
    <p>İki telefon, bir ekran, canlı söhbət</p>
  </div>

  <div class="wp-conn" id="wp-conn">Firebase-ə qoşulur...</div>

  <div class="wp-card" id="wp-setup">

    <div class="wp-step on" id="wp-step-choice">
      <div class="wp-choice-row">
        <button class="wp-choice-btn" id="wp-choice-create">Otaq yarat
          <span class="sub">Video linkini sən əlavə et</span>
        </button>
        <button class="wp-choice-btn" id="wp-choice-join">Otağa gir
          <span class="sub">Otaq kodun varsa</span>
        </button>
      </div>
    </div>

    <div class="wp-step" id="wp-step-create">
      <button class="wp-back" id="wp-back-1">‹ Geri</button>
      <div class="wp-field">
        <label>Adın</label>
        <input id="wp-name-create" type="text" placeholder="Məs: Aysel" />
      </div>
      <div class="wp-field">
        <label>Video linki (archive.org-dan birbaşa .mp4 linki)</label>
        <input id="wp-url-create" type="text" placeholder="https://archive.org/download/.../video.mp4" />
      </div>
      <button class="wp-btn" id="wp-create-go">Otaq yarat</button>
      <div class="wp-error" id="wp-error-create"></div>
    </div>

    <div class="wp-step" id="wp-step-join">
      <button class="wp-back" id="wp-back-2">‹ Geri</button>
      <div class="wp-field">
        <label>Adın</label>
        <input id="wp-name-join" type="text" placeholder="Məs: Orxan" />
      </div>
      <div class="wp-field">
        <label>Otaq kodu</label>
        <input id="wp-room-join" type="text" placeholder="Məs: seir2024" />
      </div>
      <button class="wp-btn" id="wp-join-go">Otağa gir</button>
      <div class="wp-error" id="wp-error-join"></div>
    </div>

  </div>

  <div class="wp-live" id="wp-live">
    <div class="dot"></div>
    <span class="wp-code-pill" id="wp-room-label"></span>
  </div>

  <div class="wp-video-wrap" id="wp-video-wrap">
    <video id="wp-video" controls playsinline></video>
  </div>

  <div class="wp-card wp-chat" id="wp-chat">
    <div class="wp-chat-log" id="wp-chat-log">
      <div class="wp-empty">Hələ mesaj yoxdur. İlk yazan sən ol.</div>
    </div>
    <div class="wp-chat-input">
      <input id="wp-msg-input" type="text" placeholder="Mesaj yaz..." />
      <button id="wp-send">Göndər</button>
    </div>
  </div>

  <button class="wp-btn wp-secondary" id="wp-leave" style="display:none;">Otaqdan çıx</button>
</div>

<script>
(function() {
  // ============================================================
  // FIREBASE KONFİQURASİYASI
  // Firebase Console -> Project settings -> General -> Your apps
  // hissəsindən kopyaladığın konfiqi bura yapışdır.
  // ============================================================
  const firebaseConfig = {
    apiKey: "BURAYA_API_KEY",
    authDomain: "BURAYA_PROJECT.firebaseapp.com",
    databaseURL: "https://BURAYA_PROJECT-default-rtdb.firebaseio.com",
    projectId: "BURAYA_PROJECT",
    storageBucket: "BURAYA_PROJECT.appspot.com",
    messagingSenderId: "BURAYA_SENDER_ID",
    appId: "BURAYA_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const $ = (id) => document.getElementById(id);

  let room = null;
  let myName = '';
  let video = $('wp-video');
  let stateRef = null, chatRef = null;
  let stateListenerFn = null, chatListenerFn = null;
  let lastLocalActionAt = 0;
  let suppressEvents = false;

  function refFor(r) { return db.ref('rooms/' + r); }

  function showStep(id) {
    document.querySelectorAll('.wp-step').forEach(el => el.classList.remove('on'));
    $(id).classList.add('on');
  }

  function showError(id, msg) {
    const el = $(id);
    el.textContent = msg;
    el.classList.add('on');
  }
  function hideError(id) {
    $(id).classList.remove('on');
  }

  function randomRoomCode() {
    const words = ['seir', 'gece', 'ulduz', 'nar', 'reng', 'kino', 'ipek', 'dagl', 'sahil', 'bulud'];
    const w = words[Math.floor(Math.random() * words.length)];
    const n = Math.floor(100 + Math.random() * 900);
    return w + n;
  }

  // ---- Firebase bağlantı statusu ----
  db.ref('.info/connected').on('value', (snap) => {
    const el = $('wp-conn');
    if (snap.val() === true) {
      el.textContent = 'Firebase-ə qoşuldu ✓';
      el.classList.remove('err');
    } else {
      el.textContent = 'Bağlantı yoxdur...';
      el.classList.add('err');
    }
  });

  async function createRoom() {
    hideError('wp-error-create');
    const nameVal = $('wp-name-create').value.trim();
    const urlVal = $('wp-url-create').value.trim();

    if (!nameVal) { showError('wp-error-create', 'Adını yaz.'); return; }
    if (!urlVal) { showError('wp-error-create', 'Video linkini yaz.'); return; }

    myName = nameVal;
    room = randomRoomCode();
    const base = refFor(room);
    stateRef = base.child('state');
    chatRef = base.child('chat');

    const initialState = { url: urlVal, isPlaying: false, time: 0, updatedBy: myName, updatedAt: Date.now() };

    try {
      await stateRef.set(initialState);
      await chatRef.set({ messages: [] });
    } catch (e) {
      showError('wp-error-create', 'Otaq yaradıla bilmədi. Firebase konfiqini yoxla.');
      return;
    }

    enterRoom(initialState);
  }

  async function joinRoom() {
    hideError('wp-error-join');
    const nameVal = $('wp-name-join').value.trim();
    const roomVal = $('wp-room-join').value.trim().toLowerCase().replace(/\s+/g, '');

    if (!nameVal) { showError('wp-error-join', 'Adını yaz.'); return; }
    if (!roomVal) { showError('wp-error-join', 'Otaq kodunu yaz.'); return; }

    myName = nameVal;
    room = roomVal;
    const base = refFor(room);
    stateRef = base.child('state');
    chatRef = base.child('chat');

    let existing = null;
    try {
      const snap = await stateRef.get();
      existing = snap.exists() ? snap.val() : null;
    } catch (e) {
      showError('wp-error-join', 'Bağlantı xətası. Firebase konfiqini yoxla.');
      return;
    }

    if (!existing || !existing.url) {
      showError('wp-error-join', 'Bu kodla otaq tapılmadı. Kodu yoxla.');
      return;
    }

    enterRoom(existing);
  }

  function enterRoom(state) {
    $('wp-setup').style.display = 'none';
    $('wp-live').classList.add('on');
    $('wp-room-label').textContent = 'Otaq kodu: ' + room;
    $('wp-video-wrap').classList.add('on');
    $('wp-chat').classList.add('on');
    $('wp-leave').style.display = 'block';

    video.src = state.url;
    suppressEvents = true;
    video.currentTime = state.time || 0;
    setTimeout(() => { suppressEvents = false; }, 800);
    if (state.isPlaying) video.play().catch(() => {});

    attachVideoEvents();
    startStateListener();
    startChatListener();
  }

  function attachVideoEvents() {
    video.addEventListener('play', () => {
      if (suppressEvents) return;
      pushState(true, video.currentTime);
    });
    video.addEventListener('pause', () => {
      if (suppressEvents) return;
      pushState(false, video.currentTime);
    });
    video.addEventListener('seeked', () => {
      if (suppressEvents) return;
      pushState(!video.paused, video.currentTime);
    });
  }

  function pushState(isPlaying, time) {
    lastLocalActionAt = Date.now();
    stateRef.set({
      url: video.currentSrc || video.src,
      isPlaying: isPlaying,
      time: time,
      updatedBy: myName,
      updatedAt: Date.now()
    }).catch(e => console.error('state set failed', e));
  }

  // Realtime Database-in "on value" hadisəsi push əsaslı işləyir,
  // ona görə setInterval polling əvəzinə birbaşa dinləyiciyə keçdik.
  function startStateListener() {
    stateListenerFn = (snap) => {
      const s = snap.val();
      if (!s) return;
      if (s.updatedBy === myName) return;
      if (Date.now() - lastLocalActionAt < 1200) return;

      suppressEvents = true;
      const drift = Math.abs(video.currentTime - s.time);
      if (drift > 1.5) {
        video.currentTime = s.time;
      }
      if (s.isPlaying && video.paused) {
        video.play().catch(() => {});
      } else if (!s.isPlaying && !video.paused) {
        video.pause();
      }
      setTimeout(() => { suppressEvents = false; }, 400);
    };
    stateRef.on('value', stateListenerFn);
  }

  function renderChat(messages) {
    const log = $('wp-chat-log');
    if (!messages || messages.length === 0) {
      log.innerHTML = '<div class="wp-empty">Hələ mesaj yoxdur. İlk yazan sən ol.</div>';
      return;
    }
    log.innerHTML = messages.map(m => {
      const mine = m.name === myName;
      const t = new Date(m.ts);
      const time = t.getHours().toString().padStart(2, '0') + ':' + t.getMinutes().toString().padStart(2, '0');
      return '<div class="wp-msg' + (mine ? ' mine' : '') + '">' +
        '<span class="name">' + escapeHtml(m.name) + '</span>' +
        '<span class="text">' + escapeHtml(m.text) + '</span>' +
        '<span class="time">' + time + '</span></div>';
    }).join('');
    log.scrollTop = log.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function startChatListener() {
    chatListenerFn = (snap) => {
      const c = snap.val();
      const messages = (c && c.messages) || [];
      renderChat(messages);
    };
    chatRef.on('value', chatListenerFn);
  }

  async function sendMessage() {
    const input = $('wp-msg-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    try {
      const snap = await chatRef.get();
      const c = snap.exists() ? snap.val() : null;
      const messages = (c && c.messages) || [];
      messages.push({ name: myName, text: text, ts: Date.now() });
      const trimmed = messages.slice(-100);
      await chatRef.set({ messages: trimmed });
    } catch (e) {
      console.error('mesaj göndərilmədi', e);
    }
  }

  function leaveRoom() {
    if (stateRef && stateListenerFn) stateRef.off('value', stateListenerFn);
    if (chatRef && chatListenerFn) chatRef.off('value', chatListenerFn);
    video.pause();
    video.src = '';
    $('wp-setup').style.display = 'block';
    $('wp-live').classList.remove('on');
    $('wp-video-wrap').classList.remove('on');
    $('wp-chat').classList.remove('on');
    $('wp-leave').style.display = 'none';
    showStep('wp-step-choice');
  }

  $('wp-choice-create').addEventListener('click', () => showStep('wp-step-create'));
  $('wp-choice-join').addEventListener('click', () => showStep('wp-step-join'));
  $('wp-back-1').addEventListener('click', () => showStep('wp-step-choice'));
  $('wp-back-2').addEventListener('click', () => showStep('wp-step-choice'));
  $('wp-create-go').addEventListener('click', createRoom);
  $('wp-join-go').addEventListener('click', joinRoom);
  $('wp-send').addEventListener('click', sendMessage);
  $('wp-msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
  $('wp-leave').addEventListener('click', leaveRoom);
})();
</script>

</body>
</html>
